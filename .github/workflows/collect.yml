name: F1 一手素材采集

# 跑在 GitHub 的服务器上，不受国内网络影响。
# 抓完自动 commit 回仓库，你在国内打开 archive/latest.md 就能看。

on:
  schedule:
    # 每 4 小时一次（UTC）。大奖赛周末可临时调成 */2。
    - cron: "0 */4 * * *"
  push:
    branches: [ main ]        # 你改完代码推上去就立刻跑一次
  workflow_dispatch:          # 也可以在网页上手动点一下立即跑

permissions:
  contents: write

jobs:
  collect:
    # 防止机器人自己的提交再次触发，形成死循环
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PDF 文本抽取工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: 采集
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python collect.py --limit 30

      - name: 提交归档
        run: |
          git config user.name  "f1-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "本轮无新增"
          else
            git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi
